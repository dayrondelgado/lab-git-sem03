<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rincón de Café - Contacto</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #fdf6ec; color: #3e2723;">

  <nav style="background-color: #6f4e37; padding: 15px; text-align: center;">
    <a href="index.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Inicio</a>
    <a href="about.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Nosotros</a>
    <a href="contact.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Contacto</a>
  </nav>

  <div style="padding: 40px; text-align: center;">
    <h1 style="color: #6f4e37;">Contáctanos</h1>
    <p style="font-size: 18px; max-width: 600px; margin: 20px auto;">
      ¿Tienes alguna pregunta o quieres hacer un pedido especial?
      Escríbenos, ¡nos encantará ayudarte!
    </p>

    <form style="max-width: 400px; margin: 30px auto; text-align: left;">
      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Nombre:</label>
      <input type="text" name="nombre" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #6f4e37; border-radius: 5px;">

      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Correo:</label>
      <input type="email" name="correo" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #6f4e37; border-radius: 5px;">

      <label style="display: block; margin-bottom: 5px; font-weight: bold;">Mensaje:</label>
      <textarea name="mensaje" rows="4" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #6f4e37; border-radius: 5px;"></textarea>

      <button type="submit" style="background-color: #6f4e37; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Enviar</button>
    </form>
  </div>

</body>
</html>
